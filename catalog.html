<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse the selected works and original paintings by Mona."
    />
    <title>Mona's Gallery - Paintings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav
      class="navbar"
      id="navbar-placeholder"
      aria-label="Main Navigation"
    ></nav>

    <main class="catalog-main">
      <header class="catalog-header">
        <h1>Selected Works</h1>
        <p>Original paintings, studies, and textural explorations.</p>
      </header>

      <nav class="catalog-filters" aria-label="Catalog Filters">
        <button class="filter-btn active" aria-pressed="true">All Works</button>
        <button class="filter-btn" aria-pressed="false">Available</button>
        <button class="filter-btn" aria-pressed="false">Unavailable</button>

        <select class="filter-select" aria-label="Filter by category">
          <option value="all">Select Category...</option>
          <option value="jibberish1">Foo Bar Baz</option>
          <option value="jibberish2">Lorem Ipsum</option>
          <option value="jibberish3">Dolor Sit Amet</option>
        </select>
      </nav>

      <section class="catalog-grid" id="catalog-grid">
        <!-- Картините ще се зареждат тук динамично -->
      </section>
    </main>

    <footer class="footer" id="footer-placeholder"></footer>
    <script>
      // Load Navbar safely
      fetch("page_elements/navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar-placeholder").innerHTML = data;
        });

      // Load Footer
      fetch("page_elements/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data;
        });

      // Load Catalog Data
      fetch("data/paintings.json")
        .then((response) => response.json())
        .then((paintings) => {
          const grid = document.getElementById("catalog-grid");
          let gridHTML = "";

          paintings.forEach((painting) => {
            // Ако заглавието е празно, показваме "Untitled"
            const title = painting.titleENG.trim()
              ? painting.titleENG
              : "Untitled";

            gridHTML += `
                <a href="painting.html?id=${painting.id}" class="art-card">
                    <div class="art-image-wrapper">
                        <span class="art-badge badge-available">AVAILABLE</span>
                        <img src="${painting.imageUrl}" alt="${title}" />
                    </div>
                    <div class="art-info">
                        <header class="art-title-row">
                            <h3>${title}</h3>
                            <span class="art-price">${painting.price}</span>
                        </header>
                        <p class="art-medium">Medium placeholder</p>
                        <p class="art-dimensions">${painting.size} | ${painting.date}</p>
                    </div>
                </a>
            `;
          });

          grid.innerHTML = gridHTML;
        })
        .catch((error) => console.error("Error loading paintings:", error));
    </script>
  </body>
</html>
