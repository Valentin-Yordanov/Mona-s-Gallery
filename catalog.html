<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse the selected works and original paintings by Mona."
    />
    <title>Mona's Gallery - Paintings</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/jpeg" href="page_elements/kokosan.png" />
  </head>
  <body>
    <nav
      class="navbar"
      id="navbar-placeholder"
      aria-label="Main Navigation"
    ></nav>

    <main class="catalog-main">
      <div class="ambient-glow ambient-glow--catalog"></div>
      <header class="catalog-header">
        <h1 data-i18n="catalogTitle">Selected Works</h1>
        <p data-i18n="catalogSubtitle">Original paintings, studies, and textural explorations.</p>
      </header>

      <nav class="catalog-filters" aria-label="Catalog Filters">
        <!-- Push Buttons (BEM) -->
        <div class="catalog-filters__toggles">
          <button
            class="catalog-filters__toggle-btn"
            data-filter-type="availability"
            data-value="available"
            data-i18n="btnAvail"
          >
            Available
          </button>
          <button
            class="catalog-filters__toggle-btn"
            data-filter-type="availability"
            data-value="unavailable"
            data-i18n="btnUnavail"
          >
            Unavailable
          </button>
          <button
            class="catalog-filters__toggle-btn"
            data-filter-type="originality"
            data-value="Original"
            data-i18n="btnOrig"
          >
            Original
          </button>
          <button
            class="catalog-filters__toggle-btn"
            data-filter-type="originality"
            data-value="Not Original"
            data-i18n="btnNotOrig"
          >
            Not Original
          </button>
        </div>

        <!-- Custom Dropdowns (BEM) -->
        <div class="catalog-filters__selects">
          <div class="catalog-filters__select-wrapper">
            <select
              class="catalog-filters__select"
              id="sort-select"
              aria-label="Sort by"
            >
              <option value="date-desc">Newest to Oldest</option>
              <option value="date-asc">Oldest to Newest</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
            </select>
          </div>

          <div class="catalog-filters__select-wrapper">
            <select
              class="catalog-filters__select"
              id="price-filter-select"
              aria-label="Filter by price"
            >
              <option value="all">All Prices</option>
              <option value="under-150">Under 150 €</option>
              <option value="150-250">150 € - 250 €</option>
              <option value="over-250">Over 250 €</option>
            </select>
          </div>

          <div class="catalog-filters__select-wrapper">
            <select
              class="catalog-filters__select"
              id="medium-select"
              aria-label="Filter by medium"
            >
              <option value="all">All Mediums</option>
            </select>
          </div>

          <div class="catalog-filters__select-wrapper">
            <select
              class="catalog-filters__select"
              id="size-select"
              aria-label="Filter by size"
            >
              <option value="all">All Sizes</option>
            </select>
          </div>
        </div>
      </nav>

      <section class="catalog-grid" id="catalog-grid">
        <!-- Paintings load here dynamically -->
      </section>
    </main>

    <footer class="footer" id="footer-placeholder"></footer>

    <!-- Shared Modules -->
    <script src="js/i18n.js"></script>
    <script src="js/components.js"></script>
    <script src="js/art-service.js"></script>

    <script>
      let allPaintings = [];

      async function initCatalog() {
        try {
          await Components.initLayout();
          allPaintings = await ArtService.getAll();

          setupEventListeners();
          updateDropdownLabels();
          populateDynamicDropdowns();
          syncCustomSelects();
          renderGallery();

          I18n.onLanguageChange(() => {
            updateDropdownLabels();
            document.getElementById("medium-select").value = "all";
            populateDynamicDropdowns();
            syncCustomSelects();
            renderGallery();
          });
        } catch (error) {
          console.error("Error initializing catalog:", error);
        }
      }

      function updateDropdownLabels() {
        const lang = I18n.getLanguage();

        const sortSelect = document.getElementById("sort-select");
        sortSelect.options[0].textContent = I18n.t("optSortDateDesc", lang);
        sortSelect.options[1].textContent = I18n.t("optSortDateAsc", lang);
        sortSelect.options[2].textContent = I18n.t("optSortPriceAsc", lang);
        sortSelect.options[3].textContent = I18n.t("optSortPriceDesc", lang);

        const priceSelect = document.getElementById("price-filter-select");
        priceSelect.options[0].textContent = I18n.t("optPriceAll", lang);
        priceSelect.options[1].textContent = I18n.t("optPriceUnder", lang);
        priceSelect.options[2].textContent = I18n.t("optPriceMid", lang);
        priceSelect.options[3].textContent = I18n.t("optPriceOver", lang);
      }

      /**
       * Populate dynamic dropdowns using DocumentFragment to avoid DOM thrashing.
       */
      function populateDynamicDropdowns() {
        const lang = I18n.getLanguage();
        const mediums = new Set();
        const sizes = new Set();

        allPaintings.forEach((p) => {
          const med = ArtService.getLocalized(p.medium, lang);
          if (med && med.trim()) mediums.add(med.trim());
          if (p.size && p.size.trim() && p.size.trim() !== "cm") {
            sizes.add(p.size.trim());
          }
        });

        // Medium Select
        const mediumSelect = document.getElementById("medium-select");
        const prevMedium = mediumSelect.value;
        const mediumFrag = document.createDocumentFragment();

        const defaultMediumOpt = document.createElement("option");
        defaultMediumOpt.value = "all";
        defaultMediumOpt.textContent = I18n.t("optMediumAll", lang);
        mediumFrag.appendChild(defaultMediumOpt);

        Array.from(mediums).sort().forEach((m) => {
          const opt = document.createElement("option");
          opt.value = m;
          opt.textContent = m;
          mediumFrag.appendChild(opt);
        });
        mediumSelect.replaceChildren(mediumFrag);
        if (mediums.has(prevMedium)) mediumSelect.value = prevMedium;

        // Size Select
        const sizeSelect = document.getElementById("size-select");
        const prevSize = sizeSelect.value;
        const sizeFrag = document.createDocumentFragment();

        const defaultSizeOpt = document.createElement("option");
        defaultSizeOpt.value = "all";
        defaultSizeOpt.textContent = I18n.t("optSizeAll", lang);
        sizeFrag.appendChild(defaultSizeOpt);

        Array.from(sizes).sort().forEach((s) => {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          sizeFrag.appendChild(opt);
        });
        sizeSelect.replaceChildren(sizeFrag);
        if (sizes.has(prevSize)) sizeSelect.value = prevSize;
        syncCustomSelects();
      }

      function renderGallery() {
        const grid = document.getElementById("catalog-grid");
        const lang = I18n.getLanguage();

        const activeAvail = document.querySelector(
          '.catalog-filters__toggle-btn[data-filter-type="availability"].active'
        );
        const availFilter = activeAvail ? activeAvail.getAttribute("data-value") : "all";

        const activeOrig = document.querySelector(
          '.catalog-filters__toggle-btn[data-filter-type="originality"].active'
        );
        const origFilter = activeOrig ? activeOrig.getAttribute("data-value") : "all";

        const sortFilter = document.getElementById("sort-select").value;
        const priceFilter = document.getElementById("price-filter-select").value;
        const mediumFilter = document.getElementById("medium-select").value;
        const sizeFilter = document.getElementById("size-select").value;

        const filtered = allPaintings.filter((p) => {
          const isAvailable = p.price !== null;

          if (availFilter === "available" && !isAvailable) return false;
          if (availFilter === "unavailable" && isAvailable) return false;
          if (origFilter !== "all" && p.type?.en !== origFilter) return false;

          if (priceFilter !== "all") {
            if (!isAvailable) return false;
            if (priceFilter === "under-150" && p.price >= 150) return false;
            if (priceFilter === "150-250" && (p.price < 150 || p.price > 250)) return false;
            if (priceFilter === "over-250" && p.price <= 250) return false;
          }

          const pMedium = ArtService.getLocalized(p.medium, lang);
          if (mediumFilter !== "all" && pMedium !== mediumFilter) return false;
          if (sizeFilter !== "all" && p.size !== sizeFilter) return false;

          return true;
        });

        filtered.sort((a, b) => {
          if (sortFilter === "date-desc") return (b.date || "").localeCompare(a.date || "");
          if (sortFilter === "date-asc") return (a.date || "").localeCompare(b.date || "");

          if (sortFilter === "price-asc") {
            const pA = a.price ?? Infinity;
            const pB = b.price ?? Infinity;
            return pA - pB;
          }

          if (sortFilter === "price-desc") {
            const pA = a.price ?? -Infinity;
            const pB = b.price ?? -Infinity;
            return pB - pA;
          }

          return 0;
        });

        if (filtered.length === 0) {
          grid.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color: var(--text-muted); margin-top: 2rem;">${I18n.t("textNoMatch", lang)}</p>`;
          return;
        }

        const cardsHTML = filtered.map((painting) => {
          const title = ArtService.getLocalized(painting.title, lang, I18n.t("untitled", lang));
          const type = ArtService.getLocalized(painting.type, lang, "Original");
          const medium = ArtService.getLocalized(painting.medium, lang, "");
          const year = ArtService.getYear(painting.date);
          const size = painting.size && painting.size.trim() !== "cm" ? painting.size : "";

          const isAvailable = painting.price !== null;
          const cardClass = isAvailable ? "art-card" : "art-card art-card--sold";
          const badgeClass = isAvailable ? "badge-available" : "badge-sold";
          const badgeText = isAvailable ? I18n.t("badgeAvail", lang) : I18n.t("badgeUnavail", lang);
          const displayPrice = ArtService.formatPrice(painting.price, lang);

          const detailsLine = [medium, size, year].filter(Boolean).join(" | ");

          return `
            <a href="painting.html?id=${painting.id}" class="${cardClass}">
              <div class="art-image-wrapper">
                <span class="art-badge ${badgeClass}">${badgeText}</span>
                <img src="${painting.imageUrl}" alt="${title}" loading="lazy" />
              </div>
              <div class="art-info">
                <header class="art-title-row">
                  <h3>${title}</h3>
                  <span class="art-price">${displayPrice}</span>
                </header>
                <p class="art-details-line">${type}</p>
                <p class="art-details-line">${detailsLine}</p>
              </div>
            </a>
          `;
        });

        grid.innerHTML = cardsHTML.join("");
      }

      function setupEventListeners() {
        const toggleBtns = document.querySelectorAll(".catalog-filters__toggle-btn");
        toggleBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            const type = btn.getAttribute("data-filter-type");
            if (btn.classList.contains("active")) {
              btn.classList.remove("active");
            } else {
              document
                .querySelectorAll(`.catalog-filters__toggle-btn[data-filter-type="${type}"]`)
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
            }
            renderGallery();
          });
        });

        document.querySelectorAll(".catalog-filters__select").forEach((select) => {
          select.addEventListener("change", () => {
            syncCustomSelects();
            renderGallery();
          });
        });

        // Close dropdowns when clicking outside
        document.addEventListener("click", (e) => {
          if (!e.target.closest(".custom-select")) {
            closeAllCustomSelects();
          }
        });

        // Close dropdowns on Escape key
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closeAllCustomSelects();
          }
        });
      }

      /**
       * Synchronize custom styled dropdowns with underlying native selects.
       * Provides accessible triggers, glassmorphic dropdown menus, and active indicators.
       */
      function syncCustomSelects() {
        const wrappers = document.querySelectorAll(".catalog-filters__select-wrapper");

        wrappers.forEach((wrapper) => {
          const select = wrapper.querySelector(".catalog-filters__select");
          if (!select) return;

          select.setAttribute("tabindex", "-1");
          select.setAttribute("aria-hidden", "true");

          let customSelect = wrapper.querySelector(".custom-select");

          if (!customSelect) {
            customSelect = document.createElement("div");
            customSelect.className = "custom-select";
            customSelect.setAttribute("data-for", select.id);

            const trigger = document.createElement("button");
            trigger.type = "button";
            trigger.className = "custom-select__trigger";
            trigger.setAttribute("aria-haspopup", "listbox");
            trigger.setAttribute("aria-expanded", "false");
            trigger.setAttribute(
              "aria-label",
              select.getAttribute("aria-label") || "Filter selection"
            );

            const label = document.createElement("span");
            label.className = "custom-select__label";

            const arrow = document.createElement("span");
            arrow.className = "custom-select__arrow";
            arrow.innerHTML = `
              <svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1L5 5L9 1" />
              </svg>
            `;

            trigger.appendChild(label);
            trigger.appendChild(arrow);

            const menu = document.createElement("div");
            menu.className = "custom-select__menu";
            menu.setAttribute("role", "listbox");

            const optionsList = document.createElement("div");
            optionsList.className = "custom-select__options";
            menu.appendChild(optionsList);

            customSelect.appendChild(trigger);
            customSelect.appendChild(menu);
            wrapper.appendChild(customSelect);

            trigger.addEventListener("click", (e) => {
              e.stopPropagation();
              const isOpen = customSelect.classList.contains("is-open");
              closeAllCustomSelects();
              if (!isOpen) {
                customSelect.classList.add("is-open");
                wrapper.classList.add("is-open");
                trigger.setAttribute("aria-expanded", "true");
              }
            });

            trigger.addEventListener("keydown", (e) => {
              if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                e.preventDefault();
                if (!customSelect.classList.contains("is-open")) {
                  closeAllCustomSelects();
                  customSelect.classList.add("is-open");
                  trigger.setAttribute("aria-expanded", "true");
                }
                const firstOption = optionsList.querySelector(".custom-select__option");
                if (firstOption) firstOption.focus();
              }
            });
          }

          const trigger = customSelect.querySelector(".custom-select__trigger");
          const label = customSelect.querySelector(".custom-select__label");
          const optionsList = customSelect.querySelector(".custom-select__options");
          const currentOpt = select.options[select.selectedIndex] || select.options[0];

          if (label && currentOpt) {
            label.textContent = currentOpt.textContent;
          }

          if (optionsList) {
            optionsList.innerHTML = "";
            Array.from(select.options).forEach((opt) => {
              const item = document.createElement("div");
              item.className = "custom-select__option";
              item.setAttribute("role", "option");
              item.setAttribute("data-value", opt.value);
              item.setAttribute("tabindex", "0");

              const isSelected = opt.value === select.value;
              if (isSelected) {
                item.classList.add("is-selected");
                item.setAttribute("aria-selected", "true");
              } else {
                item.setAttribute("aria-selected", "false");
              }

              const itemText = document.createElement("span");
              itemText.className = "custom-select__option-text";
              itemText.textContent = opt.textContent;

              const checkIcon = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "svg"
              );
              checkIcon.setAttribute("class", "custom-select__check");
              checkIcon.setAttribute("viewBox", "0 0 24 24");
              checkIcon.setAttribute("fill", "none");
              checkIcon.setAttribute("stroke", "currentColor");
              checkIcon.setAttribute("stroke-width", "2.5");
              checkIcon.setAttribute("stroke-linecap", "round");
              checkIcon.setAttribute("stroke-linejoin", "round");
              checkIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';

              item.appendChild(itemText);
              item.appendChild(checkIcon);

              item.addEventListener("click", (e) => {
                e.stopPropagation();
                select.value = opt.value;
                select.dispatchEvent(new Event("change"));

                label.textContent = opt.textContent;
                optionsList
                  .querySelectorAll(".custom-select__option")
                  .forEach((el) => {
                    el.classList.remove("is-selected");
                    el.setAttribute("aria-selected", "false");
                  });
                item.classList.add("is-selected");
                item.setAttribute("aria-selected", "true");

                customSelect.classList.remove("is-open");
                wrapper.classList.remove("is-open");
                trigger.setAttribute("aria-expanded", "false");
              });

              item.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  item.click();
                  trigger.focus();
                } else if (e.key === "ArrowDown") {
                  e.preventDefault();
                  const next = item.nextElementSibling;
                  if (next) next.focus();
                } else if (e.key === "ArrowUp") {
                  e.preventDefault();
                  const prev = item.previousElementSibling;
                  if (prev) prev.focus();
                  else trigger.focus();
                } else if (e.key === "Escape") {
                  e.preventDefault();
                  closeAllCustomSelects();
                  trigger.focus();
                }
              });

              optionsList.appendChild(item);
            });
          }
        });
      }

      function closeAllCustomSelects() {
        document.querySelectorAll(".custom-select.is-open").forEach((el) => {
          el.classList.remove("is-open");
          const trigger = el.querySelector(".custom-select__trigger");
          if (trigger) trigger.setAttribute("aria-expanded", "false");
        });
        document.querySelectorAll(".catalog-filters__select-wrapper.is-open").forEach((w) => {
          w.classList.remove("is-open");
        });
      }

      document.addEventListener("DOMContentLoaded", initCatalog);
    </script>
  </body>
</html>
