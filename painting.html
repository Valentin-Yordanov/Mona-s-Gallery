<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View details and inquire about Mona's artworks."
    />
    <title>Mona's Gallery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <nav
      class="navbar"
      id="navbar-placeholder"
      aria-label="Main Navigation"
    ></nav>

    <main class="painting-page">
      <a href="catalog.html" class="back-link">&larr; Back to Paintings</a>

      <section class="painting-layout">
        <div class="painting-image-wrapper">
          <img id="p-image" src="" alt="Loading..." />
        </div>

        <div class="painting-info">
          <!-- Added ID for dynamic Type insertion -->
          <div class="overline" id="p-type">ORIGINAL WORK</div>
          <h1 class="painting-title" id="p-title">Loading...</h1>

          <div class="specs-grid">
            <div class="spec-card">
              <div class="spec-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true"
                >
                  <path
                    d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 14.389 2.83481 16.5828 4.2185 18.3098C4.54922 18.7228 4.96023 19.349 4.70882 19.9882C4.51268 20.4868 4.88726 21.0375 5.41908 21.0118C8.58156 20.8587 10.9782 22 12 22Z"
                  ></path>
                  <circle cx="7.5" cy="10.5" r="1.5" fill="currentColor"></circle>
                  <circle cx="10.5" cy="7.5" r="1.5" fill="currentColor"></circle>
                  <circle cx="15.5" cy="9.5" r="1.5" fill="currentColor"></circle>
                </svg>
              </div>
              <div class="spec-text">
                <span class="spec-label">MEDIUM</span>
                <span class="spec-value" id="p-medium"></span>
              </div>
            </div>

            <div class="spec-card">
              <div class="spec-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true"
                >
                  <path
                    d="M21.44 11.05l-9.19 9.19a2 2 0 0 1-2.83 0l-5.66-5.66a2 2 0 0 1 0-2.83l9.19-9.19a2 2 0 0 1 2.83 0l5.66 5.66a2 2 0 0 1 0 2.83z"
                  ></path>
                  <line x1="8.5" y1="8.5" x2="8.51" y2="8.5"></line>
                </svg>
              </div>
              <div class="spec-text">
                <span class="spec-label">SIZE</span>
                <span class="spec-value" id="p-size"></span>
              </div>
            </div>

            <div class="spec-card">
              <div class="spec-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true"
                >
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </div>
              <div class="spec-text">
                <span class="spec-label">DATE</span>
                <span class="spec-value" id="p-date"></span>
              </div>
            </div>

            <div class="spec-card">
              <div class="spec-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true"
                >
                  <path
                    d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
                  ></path>
                  <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                  <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
              </div>
              <div class="spec-text">
                <span class="spec-label">STATUS</span>
                <span class="spec-value" id="p-status">Available</span>
              </div>
            </div>
          </div>

          <div class="purchase-action">
            <span class="price" id="p-price"></span>
            <button
              id="inquire-btn"
              class="btn-purchase"
              aria-haspopup="dialog"
              aria-expanded="false"
            >
              Inquire to Purchase
            </button>
          </div>
        </div>
      </section>
      
      <div class="description-panel" id="desc-container" style="display: none;">
        <h3>Description</h3>
        <p id="p-desc"></p>
      </div>

      <!-- Purchase Modal Panel -->
      <div
        id="purchase-modal"
        class="modal-overlay"
        role="dialog"
        aria-labelledby="modal-title"
        aria-modal="true"
      >
        <div class="modal-content">
          <button class="close-modal" id="close-modal" aria-label="Close modal">
            &times;
          </button>
          <h2 id="modal-title">Purchase Inquiry</h2>
          <p>
            To acquire this piece, please contact me directly through my social
            media channels. I handle all sales personally to ensure secure
            shipping and authenticity.
          </p>
          <div class="modal-buttons">
            <a href="#" class="btn btn-outline">Instagram</a>
            <a href="#" class="btn btn-outline">Facebook</a>
          </div>
        </div>
      </div>

      <!-- Image Zoom Modal -->
      <div id="zoom-modal" class="modal-overlay" role="dialog" aria-modal="true">
        <button class="close-modal" id="close-zoom" aria-label="Close zoom">
          &times;
        </button>
        <img id="zoomed-image" src="" alt="Zoomed View" />
      </div>

    </main>

    <footer class="footer" id="footer-placeholder"></footer>

    <script>
      // Load Navbar safely
      fetch("page_elements/navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar-placeholder").innerHTML = data;
        });

      // Load Footer
      fetch("page_elements/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data;
        });

      // Fetch dynamic painting data
      const urlParams = new URLSearchParams(window.location.search);
      const paintingId = urlParams.get("id");

      if (paintingId) {
        fetch("data/paintings.json")
          .then((response) => response.json())
          .then((paintings) => {
            const painting = paintings.find((p) => p.id === paintingId);

            if (painting) {
              const imgElement = document.getElementById("p-image");
              
              // Define title BEFORE trying to use it
              const title = painting.titleENG && painting.titleENG.trim() ? painting.titleENG : "Untitled";

              // Detect orientation and expand both layout AND page container
              imgElement.onload = () => {
                const layout = document.querySelector(".painting-layout");
                const mainPage = document.querySelector(".painting-page");

                if (imgElement.naturalWidth > imgElement.naturalHeight) {
                  layout.classList.add("landscape");
                  mainPage.classList.add("is-landscape");
                } else {
                  layout.classList.remove("landscape");
                  mainPage.classList.remove("is-landscape");
                }
              };

              // Inject Image and Text
              imgElement.src = painting.imageUrl;
              imgElement.alt = title;
              document.title = `${title} - Mona's Gallery`;
              document.getElementById("p-title").textContent = title;
              
              // Inject Type (Overline)
              document.getElementById("p-type").textContent = painting.typeENG ? painting.typeENG.toUpperCase() : "ORIGINAL WORK";
              
              // Inject Medium
              document.getElementById("p-medium").textContent = painting.madeOutOFENG || "N/A";

              // Inject Description Logic
              const descText = painting.descriptionENG && painting.descriptionENG.trim();
              if (descText) {
                document.getElementById("p-desc").textContent = descText;
                document.getElementById("desc-container").style.display = "block";
              } else {
                document.getElementById("desc-container").style.display = "none";
              }
              
              // Inject Size, Date, Price
              document.getElementById("p-size").textContent = painting.size && painting.size.trim() !== "cm" ? painting.size : "N/A";
              document.getElementById("p-date").textContent = painting.date || "N/A";
              document.getElementById("p-price").textContent = painting.price && painting.price.trim() !== "€" ? painting.price : "Price upon request";
              
            } else {
              document.getElementById("p-title").textContent = "Painting not found";
            }
          })
          .catch((error) =>
            console.error("Error loading painting details:", error),
          );
      }

      const modal = document.getElementById("purchase-modal");
      const inquireBtn = document.getElementById("inquire-btn");
      const closeBtn = document.getElementById("close-modal");

      // Open modal
      inquireBtn.addEventListener("click", () => {
        modal.classList.add("active");
        inquireBtn.setAttribute("aria-expanded", "true");
      });

      // Close modal on X click
      closeBtn.addEventListener("click", () => {
        modal.classList.remove("active");
        inquireBtn.setAttribute("aria-expanded", "false");
      });

      // Close modal when clicking outside the panel
      window.addEventListener("click", (e) => {
        if (e.target === modal) {
          modal.classList.remove("active");
          inquireBtn.setAttribute("aria-expanded", "false");
        }
      });

      // Accessibility: Close modal on Escape key
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.classList.contains("active")) {
          modal.classList.remove("active");
          inquireBtn.setAttribute("aria-expanded", "false");
        }
      });

      // Zoom Modal Logic
      const zoomModal = document.getElementById("zoom-modal");
      const zoomedImage = document.getElementById("zoomed-image");
      const closeZoomBtn = document.getElementById("close-zoom");
      const mainImage = document.getElementById("p-image");
      
      let isZoomed = false;
      let isDragging = false;
      let startX = 0, startY = 0;
      let translateX = 0, translateY = 0;
      let lastTranslateX = 0, lastTranslateY = 0;
      let isClick = true;

      function updateTransform() {
        if (isZoomed) {
          zoomedImage.style.transform = `translate(${translateX}px, ${translateY}px) scale(2.5)`;
        } else {
          zoomedImage.style.transform = `translate(0px, 0px) scale(1)`;
        }
      }

      function resetZoom() {
        isZoomed = false;
        isDragging = false;
        translateX = 0; translateY = 0;
        lastTranslateX = 0; lastTranslateY = 0;
        zoomedImage.classList.remove("is-zoomed");
        zoomedImage.style.transition = "transform var(--transition-smooth)";
        updateTransform();
      }

      // Open zoom modal
      mainImage.addEventListener("click", () => {
        zoomedImage.src = mainImage.src;
        resetZoom();
        zoomModal.classList.add("active");
      });

      // Pointer Events (Handles both Touch and Mouse)
      zoomedImage.addEventListener("pointerdown", (e) => {
        isClick = true;
        startX = e.clientX;
        startY = e.clientY;
        if (!isZoomed) return;
        
        e.preventDefault(); // Stops default image drag
        isDragging = true;
        zoomedImage.style.transition = "none"; // Disable animation while dragging
      });

      window.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        
        // 5px threshold for shaky fingers so it doesn't cancel clicks
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
          isClick = false; 
        }
        
        translateX = lastTranslateX + dx;
        translateY = lastTranslateY + dy;
        updateTransform();
      });

      window.addEventListener("pointerup", (e) => {
        if (isDragging) {
          isDragging = false;
          lastTranslateX = translateX;
          lastTranslateY = translateY;
          zoomedImage.style.transition = "transform var(--transition-smooth)";
        }
        
        // If tapped/clicked without moving, toggle zoom
        if (isClick && e.target === zoomedImage) {
          isZoomed = !isZoomed;
          if (isZoomed) {
            zoomedImage.classList.add("is-zoomed");
          } else {
            resetZoom();
          }
          updateTransform();
        }
      });

      // Close routines
      const closeZoom = () => {
        zoomModal.classList.remove("active");
        setTimeout(resetZoom, 300);
      };

      closeZoomBtn.addEventListener("click", closeZoom);
      
      zoomModal.addEventListener("click", (e) => {
        if (e.target === zoomModal) closeZoom();
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && zoomModal.classList.contains("active")) closeZoom();
      });
    </script>
  </body>
</html>
